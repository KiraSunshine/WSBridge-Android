kotlin.code.style=official

# Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.caching=true

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true

# ── Версия: ОДНА строка X.X.N, как на iOS ──────────────────────────
# X.X — блок версии, N — номер сборки внутри блока (0.3.0 = версия 0.3,
# сборка 0). Отдельной переменной для сборки нет: она уже внутри строки,
# поэтому UI и релизный тег показывают ровно одно значение.
#
# Из этой же строки выводится versionCode (major*1e6 + minor*1e4 + patch):
# 0.3.0 → 30000. versionCode обязан только РАСТИ — Android отказывается
# ставить APK с меньшим номером поверх установленного («App not installed»),
# поэтому при переходе на новый блок старый versionCode должен быть меньше
# нового: 0.3.N < 0.4.0 всегда.
wsb.version=0.3.0
