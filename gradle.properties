kotlin.code.style=official

# Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.caching=true

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true

# ── Версия: ДВА числа, оба здесь и только здесь ────────────────────
# wsb.build   — номер сборки: монотонно растёт и кормит versionCode.
#               Опускать его НЕЛЬЗЯ: Android отказывается ставить APK с
#               меньшим versionCode поверх установленного («App not
#               installed») — а preview и релиз живут в одной нумерации.
# wsb.version — маркетинговая semver: блок 0.3, N внутри блока с нуля
#               (0.3.0, 0.3.1, …), меняется осознанно на релизах. Кормит
#               versionName и проверку тега релиза (v0.3.0). От build
#               не зависит — номер сборки в UI не дублирует.
wsb.build=109
wsb.version=0.3.0
