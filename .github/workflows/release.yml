name: Release (Tag v*)

# Релизный сборщик. Запускается ТОЛЬКО пушем тега v0.2.0 и т.п.
# Создаёт GitHub Release с подписанным APK.
# Версия: versionCode и versionName берутся из одного числа — wsb.build в
# gradle.properties; тег обязан совпадать с ним, иначе job падает до сборки.
# Подпись: RELEASE_KEYSTORE_B64 + RELEASE_KEYSTORE_PASSWORD + RELEASE_KEY_ALIAS
# + RELEASE_KEY_PASSWORD в секретах; без них — debug-ключ (ставится, но не для
# обновления поверх старых релизных сборок).

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build_and_release:
    name: Build & Release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ── Версия: единственный источник — wsb.build ──────────────────────
      # app/build.gradle.kts считает buildNo = max(wsb.build, BUILD_NUMBER),
      # versionCode = buildNo, versionName = "0.2.$buildNo". Значит номер
      # релиза равен wsb.build — и ровно это же число задаётся как
      # BUILD_NUMBER ниже, чтобы релиз и preview жили в одной нумерации.
      # Раньше релиз не задавал BUILD_NUMBER вовсе, а preview брал
      # github.run_number: номер прогона растёт сам по себе, обгонял
      # wsb.build, и установка релиза поверх такого preview отбивалась
      # Android («App not installed»).
      - name: Read version
        id: ver
        run: |
          set -euo pipefail
          BUILD=$(grep -E '^[[:space:]]*wsb\.build[[:space:]]*=' gradle.properties | tail -n 1 | cut -d= -f2 | tr -d '[:space:]' || true)
          case "$BUILD" in
            ''|*[!0-9]*) echo "::error::wsb.build не найден или не число в gradle.properties"; exit 1 ;;
          esac
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "version=0.2.$BUILD" >> "$GITHUB_OUTPUT"
          echo "wsb.build=$BUILD → versionName 0.2.$BUILD, versionCode $BUILD"

      # Тег обязан описывать ту же версию, что и файл: номер берётся ИЗ
      # gradle.properties, а не из тега, поэтому тег v0.2.N при wsb.build=M
      # собрал бы APK, который в UI показывает 0.2.M (MainActivity читает
      # BuildConfig.VERSION_NAME). Падаем до сборки, а не после публикации.
      # Принимаем обе формы: v0.2.N (то, что даёт триггер 'v*') и 0.2.N.
      - name: Check tag matches wsb.build
        env:
          TAG_REF: ${{ github.ref_name }}
          EXPECTED: ${{ steps.ver.outputs.version }}
          BUILD: ${{ steps.ver.outputs.build }}
        run: |
          set -euo pipefail
          TAG="${TAG_REF#v}"
          if [ "$TAG" != "$EXPECTED" ]; then
            echo "::error::Тег $TAG_REF не совпадает с wsb.build=$BUILD (ожидается тег v$EXPECTED)."
            echo "Если верен файл — перенесите тег на текущий коммит:"
            echo "  git tag -f v$EXPECTED && git push -f origin v$EXPECTED"
            case "${TAG##*.}" in
              ''|*[!0-9]*) echo "Если верен тег — приведите wsb.build к номеру этого тега и перезапустите сборку." ;;
              *) echo "Если верен тег — поднимите wsb.build до ${TAG##*.} и переназначьте тег на коммит с этим изменением." ;;
            esac
            exit 1
          fi
          echo "OK: тег $TAG_REF = versionName $EXPECTED (versionCode $BUILD)"

      # versionCode не должен откатываться назад относительно уже
      # опубликованных релизов: Android отказывает в установке APK с меньшим
      # номером. Тег текущего прогона на remote уже существует, но он даёт
      # равенство с wsb.build, поэтому сравнение строго на «меньше».
      - name: Check versionCode is not a downgrade
        env:
          BUILD: ${{ steps.ver.outputs.build }}
        run: |
          set -euo pipefail
          TAGS=$(git ls-remote --tags --refs origin 'v0.2.*')
          PREV=$(printf '%s\n' "$TAGS" | sed -E 's#.*refs/tags/v0\.2\.##' | grep -E '^[0-9]+$' | sort -n | tail -n 1 || true)
          if [ -n "$PREV" ] && [ "$BUILD" -lt "$PREV" ]; then
            echo "::error::wsb.build=$BUILD меньше уже опубликованного релиза $PREV — обновление поверх будет отбито Android. Поднимите wsb.build минимум до $PREV."
            exit 1
          fi
          echo "OK: versionCode $BUILD (максимум опубликованного релиза: ${PREV:-нет})"

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Unit tests + Build release APK
        env:
          # BUILD_NUMBER жёстко равен wsb.build, а не github.run_number:
          # Gradle берёт max(wsb.build, BUILD_NUMBER), поэтому большее
          # значение развело бы versionCode релиза с тегом и с номером
          # preview-сборок — и обновление поверх перестало бы ставиться.
          BUILD_NUMBER: ${{ steps.ver.outputs.build }}
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew testReleaseUnitTest assembleRelease --stacktrace

      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)
          cp "$APK" "WSBridge-${{ github.ref_name }}.apk"
          gh release create "${{ github.ref_name }}" \
            "WSBridge-${{ github.ref_name }}.apk" \
            --title "WSBridge ${{ github.ref_name }}" \
            --notes "APK для Android. Ставится напрямую (без Play Store)." \
            --prerelease=false
