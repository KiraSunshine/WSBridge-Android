name: Release (Tag v*)

# Релизный сборщик. Запускается ТОЛЬКО пушем тега v0.3.0 и т.п.
# Создаёт GitHub Release с подписанным APK.
# Версия — ДВА числа из gradle.properties: wsb.build (монотонный номер
# сборки → versionCode) и wsb.version (маркетинговая semver → versionName
# и тег релиза). Тег обязан совпадать с wsb.version, а versionCode — не
# откатываться ниже опубликованного preview, иначе job падает до сборки.
# Подпись: RELEASE_KEYSTORE_B64 + RELEASE_KEYSTORE_PASSWORD + RELEASE_KEY_ALIAS
# + RELEASE_KEY_PASSWORD в секретах; без них — debug-ключ (ставится, но не для
# обновления поверх старых релизных сборок).

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build_and_release:
    name: Build & Release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ── Версия: ДВА числа, источник — gradle.properties ──────────────
      # wsb.build → versionCode (max с BUILD_NUMBER в Gradle; CI передаёт
      # BUILD_NUMBER = wsb.build, так что совпадает точно). wsb.version →
      # versionName. Значит тег релиза описывает versionName, а монотонность
      # versionCode держится на wsb.build.
      - name: Read version
        id: ver
        run: |
          set -euo pipefail
          BUILD=$(grep -E '^[[:space:]]*wsb\.build[[:space:]]*=' gradle.properties | tail -n 1 | cut -d= -f2 | tr -d '[:space:]' || true)
          case "$BUILD" in
            ''|*[!0-9]*) echo "::error::wsb.build не найден или не число в gradle.properties"; exit 1 ;;
          esac
          VERSION=$(grep -E '^[[:space:]]*wsb\.version[[:space:]]*=' gradle.properties | tail -n 1 | cut -d= -f2 | tr -d '[:space:]' || true)
          case "$VERSION" in
            ''|*[!0-9A-Za-z.\-+]*) echo "::error::wsb.version не найден в gradle.properties"; exit 1 ;;
          esac
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "wsb.build=$BUILD → versionCode $BUILD; wsb.version=$VERSION → versionName"

      # Тег обязан совпадать с МАРКЕТИНГОВОЙ версией из файла (порт iOS
      # build 109: «Check tag matches WSB_VERSION»). Версия берётся ИЗ
      # gradle.properties, а не из тега, поэтому тег v0.3.0 при
      # wsb.version=0.3.1 собрал бы APK, который в UI показывает 0.3.1
      # (MainActivity читает BuildConfig.VERSION_NAME). Падаем до сборки,
      # а не после публикации. Принимаем обе формы: v0.3.0 (даёт триггер
      # 'v*') и 0.3.0.
      - name: Check tag matches wsb.version
        env:
          TAG_REF: ${{ github.ref_name }}
          EXPECTED: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          TAG="${TAG_REF#v}"
          if [ "$TAG" != "$EXPECTED" ]; then
            echo "::error::Тег $TAG_REF не совпадает с wsb.version=$EXPECTED (ожидается тег v$EXPECTED)."
            echo "Если верен файл — перенесите тег на текущий коммит:"
            echo "  git tag -f v$EXPECTED && git push -f origin v$EXPECTED"
            echo "Если верен тег — исправьте wsb.version=$TAG в gradle.properties, закоммитьте и переназначьте тег на этот коммит."
            exit 1
          fi
          echo "OK: тег $TAG_REF = wsb.version $EXPECTED"

      # versionCode не должен откатываться назад: Android отказывает в
      # установке APK с меньшим номером. Релиз и preview живут в ОДНОЙ
      # нумерации (оба берут wsb.build), поэтому источник для сравнения —
      # последняя опубликованная preview: build-маркер в её описании
      # («build N», пишет build.yml). Маркера нет (первый релиз после
      # смены схемы) — проверка пропускается.
      - name: Check versionCode is not a downgrade
        env:
          BUILD: ${{ steps.ver.outputs.build }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PREV=$(gh release view preview --json body --jq .body 2>/dev/null | grep -oE 'build [0-9]+' | grep -oE '[0-9]+' | tail -n 1 || true)
          if [ -n "$PREV" ] && [ "$BUILD" -lt "$PREV" ]; then
            echo "::error::wsb.build=$BUILD меньше опубликованной preview (build $PREV) — обновление поверх будет отбито Android. Поднимите wsb.build минимум до $PREV."
            exit 1
          fi
          echo "OK: versionCode $BUILD (preview: ${PREV:-нет маркера})"

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Unit tests + Build release APK
        env:
          # BUILD_NUMBER жёстко равен wsb.build, а не github.run_number:
          # Gradle берёт max(wsb.build, BUILD_NUMBER), поэтому большее
          # значение развело бы versionCode релиза с тегом и с номером
          # preview-сборок — и обновление поверх перестало бы ставиться.
          BUILD_NUMBER: ${{ steps.ver.outputs.build }}
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew testReleaseUnitTest assembleRelease --stacktrace

      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)
          cp "$APK" "WSBridge-${{ github.ref_name }}.apk"
          gh release create "${{ github.ref_name }}" \
            "WSBridge-${{ github.ref_name }}.apk" \
            --title "WSBridge ${{ github.ref_name }}" \
            --notes "APK для Android. Ставится напрямую (без Play Store)." \
            --prerelease=false
