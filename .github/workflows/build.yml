name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ── Версия: ДВА числа, источник — gradle.properties ──────────────
      # wsb.build — монотонный номер сборки → versionCode (max с BUILD_NUMBER
      # в Gradle). wsb.version — маркетинговая semver → versionName.
      # Раньше preview брал сюда github.run_number: счётчик прогонов растёт
      # сам по себе, обгонял wsb.build, и установить релиз поверх такого
      # preview Android отказывался («App not installed»). Теперь и preview,
      # и релиз берут одно число — wsb.build. Явная проверка нужна, чтобы
      # отсутствие ключа не превратилось молча в versionCode = 1 (фолбэк
      # в Gradle).
      - name: Read version
        id: ver
        run: |
          set -euo pipefail
          BUILD=$(grep -E '^[[:space:]]*wsb\.build[[:space:]]*=' gradle.properties | tail -n 1 | cut -d= -f2 | tr -d '[:space:]' || true)
          case "$BUILD" in
            ''|*[!0-9]*) echo "::error::wsb.build не найден или не число в gradle.properties"; exit 1 ;;
          esac
          VERSION=$(grep -E '^[[:space:]]*wsb\.version[[:space:]]*=' gradle.properties | tail -n 1 | cut -d= -f2 | tr -d '[:space:]' || true)
          case "$VERSION" in
            ''|*[!0-9A-Za-z.\-+]*) echo "::error::wsb.version не найден в gradle.properties"; exit 1 ;;
          esac
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "wsb.build=$BUILD → versionCode $BUILD; wsb.version=$VERSION → versionName"

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Unit tests + Build APK
        env:
          # Стабильная подпись: APK подписывается одним ключом из секретов,
          # поэтому новая сборка ставится ПОВЕРХ старой без удаления. Версия
          # берётся из wsb.build — того же числа, что и в релизном теге, иначе
          # preview уехал бы вперёд релиза и обновление «поверх» сломалось бы.
          BUILD_NUMBER: ${{ steps.ver.outputs.build }}
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew testDebugUnitTest --stacktrace
          ./gradlew assembleRelease --stacktrace

      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk dist/WSBridge.apk

      - uses: actions/upload-artifact@v4
        with:
          name: WSBridge-APK
          path: dist/*.apk
          if-no-files-found: error

      # Каждый пуш в main обновляет prerelease "preview" (как в WSBridge-iOS).
      # APK подписан стабильным ключом, а versionCode равен wsb.build — то есть
      # совпадает с номером ближайшего релиза, поэтому и preview, и релиз
      # ставятся друг поверх друга. Номер поднимается вручную в
      # gradle.properties перед тегом (релизный воркфлоу это проверяет).
      # «Build N» в notes — маркер: релизный guard читает его и не даёт
      # выпустить релиз с versionCode ниже уже опубликованного preview.
      - name: Update preview release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete preview --yes 2>/dev/null || true
          git push origin :refs/tags/preview 2>/dev/null || true
          gh release create preview \
            dist/WSBridge.apk \
            --title "Preview (latest main)" \
            --notes "Дев-сборка с последнего пуша в main (build ${{ steps.ver.outputs.build }}). Для стабильных версий — Releases." \
            --prerelease
